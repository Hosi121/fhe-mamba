name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    env:
      PYTHON: .venv/bin/python
      CHECK_JOBS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          python-version: "${{ matrix.python-version }}"

      - name: Install locked development environment
        run: uv sync --locked --extra dev

      - name: Build distributions
        run: uv build

      - name: Run checks
        run: scripts/run_checks.sh

      - name: Exercise the CPU example and published evidence
        run: |
          .venv/bin/python examples/cpu_smoke.py
          .venv/bin/python examples/mamba3_cpu_smoke.py
          .venv/bin/fhemamba validate-artifacts --require-commit \
            results/dgx/2026-09-22/subring-gates/generation.json \
            results/dgx/2026-09-22/subring-gates/m2_chain_subring-client-generation_l24_t5.json

      - name: Verify installed wheel outside the checkout
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.venv/bin/fhemamba" --version
          "$GITHUB_WORKSPACE/.venv/bin/python" -I "$GITHUB_WORKSPACE/examples/cpu_smoke.py"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I "$GITHUB_WORKSPACE/examples/mamba3_cpu_smoke.py"
