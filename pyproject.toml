[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhemamba"
version = "0.5.0"
description = "FHE Mamba: private language-model inference with CKKS and encrypted recurrent state."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "cipher research" }]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "datasets>=4.0",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "ruff>=0.6",
  "transformers>=5.2",
]
experiments = [
  "datasets>=4.0",
  "transformers>=5.2",
]
[project.scripts]
fhemamba = "fhemamba.cli:main"

[project.urls]
Repository = "https://github.com/Hosi121/fhe-native-mamba3"
Documentation = "https://github.com/Hosi121/fhe-native-mamba3/tree/main/docs"
Issues = "https://github.com/Hosi121/fhe-native-mamba3/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PT",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["tests/*"]
source_pkgs = ["fhemamba"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
